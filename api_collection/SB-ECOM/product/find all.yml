info:
  name: find all
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:8080/api/public/product?pageNumber=1&pageSize=15&sortBy=productName&sortOrder=asc
  params:
    - name: pageNumber
      value: "1"
      type: query
    - name: pageSize
      value: "15"
      type: query
    - name: sortBy
      value: productName
      type: query
    - name: sortOrder
      value: asc
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
